name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx eslint src/ --report-unused-disable-directives --max-warnings 0
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run audit:strict
      - run: npm run build

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E (formula render smoke)
        # 必须走 test:e2e：它内部先 `vite build` 产出 dist/ 再跑 Playwright。
        # playwright.config.ts 的 webServer 是 `vite preview`，只认 dist/；而 dist/ 不入库
        # （.gitignore），本 job 若不先构建，vite preview 会因找不到产物而启动失败。
        # 不能用 `npm run build`（= electron-vite build）：它产出 out/renderer/，dist/ 仍为空。
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
